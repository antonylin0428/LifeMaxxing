AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LifeMaxxing backend - Cognito + HTTP API + Lambda + DynamoDB (on-demand)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        CATEGORY_STATS_TABLE: !Ref CategoryStatsTable
        DAILY_LOGS_TABLE: !Ref DailyLogsTable
        XP_EVENTS_TABLE: !Ref XPEventsTable
        FRIEND_REQUESTS_TABLE: !Ref FriendRequestsTable
        FRIENDSHIPS_TABLE: !Ref FriendshipsTable
        COMMUNITIES_TABLE: !Ref CommunitiesTable
        PHOTOS_BUCKET: !Ref GymPhotosBucket
        PURCHASE_EVENTS_TABLE: !Ref PurchaseEventsTable

Resources:

  # ---------------------------------------------------------------------
  # Shared Lambda layer: xpRules, rankLadder, identity, serverClock, http,
  # dynamoClient. Plain JS, no build step - sam build copies it as-is.
  # ---------------------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: lifemaxxing-shared
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------
  # Cognito - the ONLY source of identity for the app. No Identity Pool is
  # provisioned anywhere in this stack: the iOS app never receives AWS
  # credentials, only JWTs, so it has no path to talk to DynamoDB directly.
  # ---------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: lifemaxxing-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: preferred_username
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  CognitoPostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: lifemaxxing-ios
      GenerateSecret: false # public mobile client, no client secret
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------------------------------------------------------------------
  # API Gateway HTTP API with a native Cognito JWT authorizer. Every route
  # below is protected by default - there is no public route in this app.
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
              audience:
                - !Ref CognitoUserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # DynamoDB tables - all on-demand (PAY_PER_REQUEST). See plan section 4
  # for the full access-pattern rationale.
  # ---------------------------------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # Season-readiness: GSI2 (GSI2PK=SEASON#<id>, GSI2SK=SEASONXP#<padded>)
      # gets added here later, once seasons launch - pure additive change,
      # seasonXP/currentSeasonId attributes already exist on every item.

  CategoryStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  DailyLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  XPEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  FriendRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FriendshipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Gym photos: private S3 bucket. iOS never gets AWS credentials; it
  # receives a pre-signed PUT URL from GetUploadUrlFunction (5-min expiry),
  # uploads directly, then passes only the s3Key to completeTask.
  # 30-day lifecycle keeps storage costs bounded (~$0.023/GB/month).
  GymPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
            AllowedOrigins:
              - '*'
            AllowedHeaders:
              - '*'
            MaxAge: 3000

  # StoreKit purchase deduplication table. Stores transactionId for every
  # processed App Store receipt so replays and double-grants are rejected.
  # TTL of 90 days keeps the table small.
  PurchaseEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Communities: PK=COMMUNITY#<id>, SK=PROFILE|MEMBER#<sub>
  # GSI1 (GSI1PK=USER#<sub>, GSI1SK=COMMUNITY#<id>) enables listMyCommunities queries.
  CommunitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------
  # Lambda functions - one per route, least-privilege IAM per function.
  # ---------------------------------------------------------------------

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/postConfirmation/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt UsersTable.Arn

  CompleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/completeTask/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt CategoryStatsTable.Arn
                - !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt DailyLogsTable.Arn
                - !GetAtt XPEventsTable.Arn
                - !GetAtt CategoryStatsTable.Arn
                - !GetAtt UsersTable.Arn
      Events:
        CompleteTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/complete
            Method: POST

  UseStreakFreezeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/useStreakFreeze/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CategoryStatsTable.Arn
      Events:
        UseStreakFreeze:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/freeze
            Method: POST

  GetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getMe/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${GymPhotosBucket.Arn}/avatars/*"
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/updateProfile/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt UsersTable.Arn
                - !Sub "${UsersTable.Arn}/index/GSI1"
      Events:
        UpdateProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/profile
            Method: PUT

  GetAvatarUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getAvatarUploadUrl/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${GymPhotosBucket.Arn}/avatars/*"
      Events:
        GetAvatarUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/avatar-upload-url
            Method: GET

  GetCategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getCategories/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt CategoryStatsTable.Arn
      Events:
        GetCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/categories
            Method: GET

  UpdateCategoryConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/updateCategoryConfig/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt CategoryStatsTable.Arn
      Events:
        UpdateCategoryConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/categories/{categoryId}
            Method: PUT

  # Dev-only entitlement toggle - gated by ENVIRONMENT=dev env var at runtime.
  # Returns 404 in production. Remove this function entirely post-launch.
  SetMockPremiumFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/setMockPremium/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        SetMockPremium:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/premium
            Method: PUT

  CreateCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/createCommunity/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt CommunitiesTable.Arn
      Events:
        CreateCommunity:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /communities
            Method: POST

  GetCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getCommunity/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt CommunitiesTable.Arn
      Events:
        GetCommunity:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /communities/{communityId}
            Method: GET

  JoinCommunityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/joinCommunity/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt CommunitiesTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CommunitiesTable.Arn
      Events:
        JoinCommunity:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /communities/{communityId}/join
            Method: POST

  ListMyCommunitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/listMyCommunities/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt CommunitiesTable.Arn
                - !Sub "${CommunitiesTable.Arn}/index/GSI1"
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource: !GetAtt CommunitiesTable.Arn
      Events:
        ListMyCommunities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/communities
            Method: GET

  GetCommunityLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getCommunityLeaderboard/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt CommunitiesTable.Arn
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        GetCommunityLeaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /communities/{communityId}/leaderboard
            Method: GET

  SearchFriendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/searchFriends/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt UsersTable.Arn
                - !Sub "${UsersTable.Arn}/index/GSI1"
      Events:
        SearchFriends:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /friends/search
            Method: GET

  FriendRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/friendRequest/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt FriendRequestsTable.Arn
                - !Sub "${FriendRequestsTable.Arn}/index/GSI1"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FriendRequestsTable.Arn
      Events:
        FriendRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /friends/request
            Method: POST

  FriendAcceptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/friendAccept/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                - !GetAtt FriendRequestsTable.Arn
                - !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt FriendRequestsTable.Arn
                - !GetAtt FriendshipsTable.Arn
      Events:
        FriendAccept:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /friends/accept
            Method: POST

  FriendDeclineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/friendDecline/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt FriendRequestsTable.Arn
      Events:
        FriendDecline:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /friends/decline
            Method: POST

  ListFriendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/listFriends/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt FriendshipsTable.Arn
      Events:
        ListFriends:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /friends
            Method: GET

  ListPendingRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/listPendingRequests/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt FriendRequestsTable.Arn
                - !Sub "${FriendRequestsTable.Arn}/index/GSI1"
      Events:
        ListPendingRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /friends/requests
            Method: GET

  # Runs daily at 03:00 UTC: updates activeDaysLast30/60 and eliteWeeksCount
  # so Chad Light / Chad rank gates can actually be crossed.
  DailyMaintenanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/dailyMaintenance/
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt DailyLogsTable.Arn
                - !GetAtt XPEventsTable.Arn
                - !GetAtt CategoryStatsTable.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 * * ? *)
            Description: Daily user stats maintenance

  # Runs weekly on Monday 04:00 UTC: replenishes streak freeze allowance.
  WeeklyMaintenanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/weeklyMaintenance/
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt CategoryStatsTable.Arn
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 4 ? * MON *)
            Description: Weekly streak freeze replenishment

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/leaderboard/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt FriendshipsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        Leaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /leaderboard/friends
            Method: GET

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getUploadUrl/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${GymPhotosBucket.Arn}/gym-photos/*"
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/upload-url
            Method: GET

  GetFriendsFeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/getFriendsFeed/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt FriendshipsTable.Arn
                - !GetAtt DailyLogsTable.Arn
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource:
                - !GetAtt UsersTable.Arn
                - !GetAtt CategoryStatsTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${GymPhotosBucket.Arn}/gym-photos/*"
      Events:
        GetFriendsFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /feed/friends
            Method: GET

  # Apple App Store Server Notifications webhook. Public endpoint (no Cognito)
  # because Apple sends the JWT-signed payload directly, not through a user session.
  # Verifies Apple's signed JWS transaction, deduplicates via PurchaseEventsTable,
  # and sets hasCommunityAccess=true on the matching user.
  AppleWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/appleWebhook/
      Handler: index.handler
      Environment:
        Variables:
          APPLE_BUNDLE_ID: com.lifemaxxing.app
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PurchaseEventsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt UsersTable.Arn
                - !Sub "${UsersTable.Arn}/index/GSI1"
      Events:
        AppleWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /apple/webhook
            Method: POST
            Auth:
              Authorizer: NONE

  # Called by iOS immediately after a successful StoreKit purchase to grant
  # access without waiting for the async Apple webhook. Protected by Cognito
  # (user must be signed in). Verifies the signed transaction with Apple's
  # App Store Server API, deduplicates, and sets hasCommunityAccess=true.
  VerifyApplePurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/verifyApplePurchase/
      Handler: index.handler
      Environment:
        Variables:
          APPLE_BUNDLE_ID: com.lifemaxxing.app
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PurchaseEventsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        VerifyApplePurchase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /purchases/verify
            Method: POST

Outputs:
  HttpApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
  UsersTableName:
    Value: !Ref UsersTable
  CategoryStatsTableName:
    Value: !Ref CategoryStatsTable
  DailyLogsTableName:
    Value: !Ref DailyLogsTable
  XPEventsTableName:
    Value: !Ref XPEventsTable
  FriendRequestsTableName:
    Value: !Ref FriendRequestsTable
  FriendshipsTableName:
    Value: !Ref FriendshipsTable
  CommunitiesTableName:
    Value: !Ref CommunitiesTable
  GymPhotosBucketName:
    Value: !Ref GymPhotosBucket
  PurchaseEventsTableName:
    Value: !Ref PurchaseEventsTable
